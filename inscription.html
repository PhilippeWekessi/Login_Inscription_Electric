<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Electric Design</title>
    <link rel="stylesheet" href="stylei.css">
</head>
<body>
    <div class="circle">
        <div class="card">
            <h2 class="title">Inscription</h2>
            <form id="signup-form">
                <div class="input-box">
                    <input type="text" id="nom" placeholder="Nom" required>
                </div>
                <div class="input-box">
                    <input type="text" id="prenom" placeholder="Prénom" required>
                </div>
                <div class="input-box">
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <div class="input-box">
                    <input type="password" id="password" placeholder="Mot de passe" required>
                </div>
                <div class="input-box">
                    <input type="password" id="confirm-password" placeholder="Confirmer mot de passe" required>
                </div>
                <button type="submit">S'inscrire</button>
            </form>
            <p class="link-text">Déjà membre ? <a href="login.html">Connexion</a></p>
        </div>
    </div>
    <script src="scripti.js"></script>
</body>
</html>
