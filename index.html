<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Electric Login</title>
    <link rel="stylesheet" href="stylel.css">
</head>
<body>
    <div class="circle">
        <div class="card">
            <h2 class="login-title">Login</h2>
            <!-- Ajout de la balise form pour la gestion du bouton -->
            <form id="login-form">
                <div class="input-box">
                    <input type="text" placeholder="Username" required>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" required>
                </div>
                <button type="submit">Sign In</button>
            </form>
            <p class="link-text">Pas encore membre ? <a href="inscription.html">Inscription</a></p>
        </div>
    </div>
    <script src="scriptl.js"></script>
</body>
</html>
